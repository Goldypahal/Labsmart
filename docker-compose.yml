version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labsmart_postgres
    restart: always
    environment:
      POSTGRES_DB: labsmart_db
      POSTGRES_USER: labsmart_user
      POSTGRES_PASSWORD: labsmart_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labsmart_user -d labsmart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labsmart_redis
    restart: always
    command: redis-server --requirepass labsmart_redis_password_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "labsmart_redis_password_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: labsmart_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password_2026
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labsmart_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://labsmart_user:labsmart_secure_password_2026@postgres:5432/labsmart_db?schema=public
      REDIS_URL: redis://:labsmart_redis_password_2026@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: labsmart-reports
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_secret_password_2026
      JWT_ACCESS_SECRET: secure_access_token_secret_min_32_bytes_long
      JWT_REFRESH_SECRET: secure_refresh_token_secret_min_32_bytes_long
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
